<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Estudio de Arte</title>

    <style>
        :root { --bg-color: #2E2E2E; --panel-color: #3A3A3A; --text-color: #E0E0E0; --text-muted: #9CA3AF; --accent-color: #60A5FA; --border-color: rgba(255, 255, 255, 0.1); }
        body { overscroll-behavior: none; touch-action: pan-y; -webkit-user-select: none; user-select: none; background-color: var(--bg-color); color: var(--text-color); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); } .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); } .safe-pl { padding-left: env(safe-area-inset-left, 20px); }
        ::-webkit-scrollbar { display: none; }
        
        /* Ocultar elementos inactivos de las pestañas */
        .workspace-hidden { display: none !important; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'studio-bg': 'var(--bg-color)', 'studio-panel': 'var(--panel-color)', 'studio-text': 'var(--text-color)', 'studio-muted': 'var(--text-muted)', 'studio-accent': 'var(--accent-color)', 'studio-border': 'var(--border-color)' } } } }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>

<body id="app-container" class="h-screen w-screen overflow-hidden flex font-sans">

    <!-- BARRA LATERAL -->
    <nav class="bg-studio-panel w-20 flex flex-col items-center py-6 safe-pt safe-pb shadow-xl z-20">
        <button class="mb-10 p-3 rounded-2xl bg-studio-bg shadow-inner text-studio-accent">
            <i class="ph ph-paint-brush-broad text-2xl"></i>
        </button>
        
        <!-- Pestañas de Espacios de Trabajo -->
        <div class="flex flex-col gap-4 w-full items-center">
            <button onclick="switchWorkspace('personal')" id="tab-personal" class="p-3 rounded-xl bg-studio-bg/50 text-studio-accent transition-colors" title="Proyectos Personales">
                <i class="ph ph-user text-2xl"></i>
            </button>
            <button onclick="switchWorkspace('work')" id="tab-work" class="p-3 rounded-xl hover:bg-studio-bg/30 text-studio-muted transition-colors" title="Trabajo Pagado / Comisiones">
                <i class="ph ph-briefcase text-2xl"></i>
            </button>
            <button onclick="switchWorkspace('ideas')" id="tab-ideas" class="p-3 rounded-xl hover:bg-studio-bg/30 text-studio-muted transition-colors" title="Caja de Ideas">
                <i class="ph ph-lightbulb text-2xl"></i>
            </button>
        </div>

        <div class="mt-auto flex flex-col gap-4">
            <!-- Botón de Idea Rápida (Global) -->
            <button onclick="openIdeaModal()" class="p-3 rounded-xl bg-yellow-500/20 text-yellow-500 hover:bg-yellow-500/40 transition-colors shadow-lg" title="Captura Rápida">
                <i class="ph ph-lightning text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative h-full safe-pt safe-pb overflow-y-auto px-10">
        
        <header class="py-8 border-b border-studio-border mb-8 flex justify-between items-end">
            <div>
                <h1 id="workspace-title" class="text-4xl font-light mb-2">Proyectos Personales</h1>
                <p id="workspace-subtitle" class="text-studio-muted text-sm">Tu espacio de exploración libre.</p>
            </div>
            
            <!-- Buscador visual de temas -->
            <div class="flex items-center bg-studio-panel rounded-full px-4 py-2 border border-studio-border">
                <i class="ph ph-magnifying-glass text-studio-muted mr-2"></i>
                <input type="text" placeholder="Buscar por tema (#óleo, #rojo)..." class="bg-transparent border-none focus:outline-none text-sm w-48 text-studio-text" onkeyup="filterByTag(this.value)">
            </div>
        </header>

        <!-- Cuadrícula de Proyectos / Ideas -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-20" id="projects-grid">
            <!-- Contenido dinámico -->
        </div>

    </main>

    <!-- MODAL: NUEVO PROYECTO COMPLETO -->
    <div id="new-project-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-studio-panel w-[550px] rounded-3xl p-8 shadow-2xl border border-studio-border">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-light">Nuevo Proyecto</h2>
                <button onclick="closeModal('new-project-modal')" class="text-studio-muted hover:text-white"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <form onsubmit="saveProject(event)" class="flex flex-col gap-5">
                <div>
                    <label class="block text-sm text-studio-muted mb-2">Título</label>
                    <input type="text" id="proj-title" required class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 focus:border-studio-accent outline-none">
                </div>
                <div>
                    <!-- El nuevo sistema de Etiquetas Abiertas -->
                    <label class="block text-sm text-studio-muted mb-2">Temas y Categorías (Etiquetas)</label>
                    <input type="text" id="proj-tags" placeholder="Ej: #óleo, #retrato, #clienteX" class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 focus:border-studio-accent outline-none">
                    <p class="text-xs text-studio-muted mt-2">Separa los temas por comas. El sistema agrupará obras similares.</p>
                </div>
                <button type="submit" class="mt-4 bg-studio-accent text-white font-bold rounded-xl p-4 active:scale-95 transition-transform">Crear en este Espacio</button>
            </form>
        </div>
    </div>

    <!-- MODAL: IDEA RÁPIDA (Relámpago) -->
    <div id="quick-idea-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-start justify-center pt-32">
        <div class="bg-studio-panel w-[500px] rounded-3xl p-6 shadow-2xl border border-yellow-500/30">
            <h2 class="text-xl text-yellow-500 flex items-center gap-2 mb-4"><i class="ph ph-lightning"></i> Captura de Idea</h2>
            <textarea id="idea-text" rows="3" placeholder="Escribe tu idea fugaz aquí..." class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 focus:border-yellow-500 outline-none resize-none text-lg"></textarea>
            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeModal('quick-idea-modal')" class="px-4 py-2 text-studio-muted">Cancelar</button>
                <button onclick="saveIdea()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-xl active:scale-95">Archivar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ACTUALIZACIÓN DE BASE DE DATOS (v2)
        // ==========================================
        const db = new Dexie("StudioArtDB");
        
        // Hemos subido la versión a 2 para modificar las tablas sin que se rompa.
        db.version(2).stores({
            // Añadido 'workspace' y '*tags' (el asterisco permite buscar dentro de listas)
            projects: '++id, title, workspace, *tags, type, dateCreated', 
            // Añadido x, y, width, height, zIndex para preparar el terreno de Milanote
            references: '++id, projectId, type, imageBlob, textContent, x, y, width, height, zIndex' 
        });

        let currentWorkspace = 'personal';

        window.addEventListener('DOMContentLoaded', () => loadWorkspace(currentWorkspace));

        // ==========================================
        // 2. LÓGICA DE ESPACIOS DE TRABAJO
        // ==========================================
        function switchWorkspace(workspaceId) {
            currentWorkspace = workspaceId;
            
            // UI: Cambiar estilos de pestañas
            ['personal', 'work', 'ideas'].forEach(id => {
                const btn = document.getElementById(`tab-${id}`);
                if(id === workspaceId) {
                    btn.classList.add('bg-studio-bg/50', 'text-studio-accent');
                    btn.classList.remove('text-studio-muted');
                } else {
                    btn.classList.remove('bg-studio-bg/50', 'text-studio-accent');
                    btn.classList.add('text-studio-muted');
                }
            });

            // UI: Cambiar textos de cabecera
            const title = document.getElementById('workspace-title');
            const sub = document.getElementById('workspace-subtitle');
            
            if(workspaceId === 'personal') { title.innerText = 'Proyectos Personales'; sub.innerText = 'Tu espacio de exploración libre.'; }
            if(workspaceId === 'work') { title.innerText = 'Trabajo Pagado'; sub.innerText = 'Comisiones y proyectos profesionales.'; }
            if(workspaceId === 'ideas') { title.innerText = 'Caja de Ideas'; sub.innerText = 'Conceptos archivados para el futuro.'; }

            loadWorkspace(workspaceId);
        }

        // ==========================================
        // 3. CARGA Y BUSCADOR DE SIMILITUDES
        // ==========================================
        async function loadWorkspace(workspaceId, searchQuery = "") {
            let items;
            
            // Buscar por coincidencia de texto en etiquetas
            if (searchQuery.trim() !== "") {
                const query = searchQuery.toLowerCase().trim();
                // Filtra en el espacio actual buscando la etiqueta
                items = await db.projects.where('workspace').equals(workspaceId).toArray();
                items = items.filter(item => 
                    item.tags.some(tag => tag.toLowerCase().includes(query)) || 
                    item.title.toLowerCase().includes(query)
                );
            } else {
                items = await db.projects.where('workspace').equals(workspaceId).toArray();
            }

            const grid = document.getElementById('projects-grid');
            
            // Botón de nuevo (solo si no estamos en 'ideas')
            grid.innerHTML = workspaceId !== 'ideas' ? `
                <button class="bg-studio-panel border-2 border-dashed border-studio-border rounded-3xl h-56 flex flex-col items-center justify-center hover:border-studio-accent transition-all group" onclick="openModal('new-project-modal')">
                    <div class="bg-studio-bg p-4 rounded-full mb-4 shadow-inner text-studio-muted group-hover:text-studio-accent"><i class="ph ph-plus text-3xl"></i></div>
                    <span class="text-studio-muted font-medium group-hover:text-studio-text">Nuevo Proyecto</span>
                </button>
            ` : '';

            items.forEach(item => {
                const date = new Date(item.dateCreated).toLocaleDateString('es-ES');
                // Formatear etiquetas como pastillas visuales
                const tagsHtml = item.tags.slice(0,3).map(tag => `<span class="text-xs bg-studio-bg text-studio-muted px-2 py-1 rounded-md mr-1 border border-studio-border">${tag}</span>`).join('');
                
                grid.innerHTML += `
                    <div class="bg-studio-panel border border-studio-border rounded-3xl h-56 p-6 flex flex-col hover:ring-2 ring-studio-accent cursor-pointer transition-all shadow-lg group relative">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                            <button class="text-studio-muted opacity-0 group-hover:opacity-100 hover:text-red-400" onclick="deleteItem(event, ${item.id})"><i class="ph ph-trash text-xl"></i></button>
                        </div>
                        <div class="mt-auto">
                            <h2 class="text-xl font-medium text-studio-text mb-1 line-clamp-2">${item.title}</h2>
                            <p class="text-studio-muted text-xs">Creado: ${date}</p>
                        </div>
                    </div>
                `;
            });
        }

        function filterByTag(query) {
            loadWorkspace(currentWorkspace, query);
        }

        // ==========================================
        // 4. GUARDADO DE PROYECTOS Y NOTAS RÁPIDAS
        // ==========================================
        async function saveProject(event) {
            event.preventDefault();
            // Convertir el texto "#óleo, retrato" en un Array ["#óleo", "retrato"] limpiando espacios
            const rawTags = document.getElementById('proj-tags').value;
            const tagArray = rawTags.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            await db.projects.add({ 
                title: document.getElementById('proj-title').value, 
                workspace: currentWorkspace,
                tags: tagArray,
                type: 'project',
                dateCreated: new Date().toISOString() 
            });
            closeModal('new-project-modal');
            loadWorkspace(currentWorkspace);
        }

        async function saveIdea() {
            const text = document.getElementById('idea-text').value;
            if(!text) return;

            // Detectar hashtags en el texto automáticamente
            const hashtags = text.match(/#[a-záéíóúñ0-9_]+/gi) || [];

            await db.projects.add({ 
                title: text, 
                workspace: 'ideas', // Va directo a la bandeja de ideas
                tags: hashtags,
                type: 'idea',
                dateCreated: new Date().toISOString() 
            });
            
            closeModal('quick-idea-modal');
            document.getElementById('idea-text').value = '';
            
            // Si estábamos en la vista de ideas, recargar. Si no, avisar que se guardó.
            if(currentWorkspace === 'ideas') loadWorkspace('ideas');
            else alert("Idea archivada en tu Caja de Ideas.");
        }

        // ==========================================
        // UTILIDADES
        // ==========================================
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openIdeaModal() { openModal('quick-idea-modal'); document.getElementById('idea-text').focus(); }
        
        async function deleteItem(event, id) {
            event.stopPropagation();
            if(confirm("¿Eliminar este elemento permanentemente?")) {
                await db.projects.delete(id);
                loadWorkspace(currentWorkspace);
            }
        }
    </script>
</body>
</html>
