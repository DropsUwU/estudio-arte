<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Estudio de Arte</title>

    <style>
        /* TEMAS ANTERIORES */
        :root {
            --bg-color: #2E2E2E; --panel-color: #3A3A3A; --text-color: #E0E0E0; --text-muted: #9CA3AF; --accent-color: #60A5FA; --border-color: rgba(255, 255, 255, 0.1);
        }
        .theme-warm {
            --bg-color: #2A2624; --panel-color: #36302D; --text-color: #E7E5E4; --text-muted: #A8A29E; --accent-color: #F59E0B; --border-color: rgba(255, 255, 255, 0.08);
        }
        .theme-daylight {
            --bg-color: #E5E7EB; --panel-color: #F3F4F6; --text-color: #1F2937; --text-muted: #4B5563; --accent-color: #2563EB; --border-color: rgba(0, 0, 0, 0.1);
        }

        /* NUEVO: TEMA FRUTIGER AERO (Aero Glass) */
        .theme-frutiger {
            /* Fondo azul cielo sutil (Aurora) */
            --bg-color: #E0F2FE; 
            /* Texto azul profundo marino */
            --text-color: #082F49;
            --text-muted: #0284C7;
            --accent-color: #0EA5E9;
            --border-color: rgba(255, 255, 255, 0.8);
        }

        /* MOTOR DE EFECTO CRISTAL (Solo se activa con Frutiger Aero) */
        .theme-frutiger body {
            background: radial-gradient(circle at 50% -20%, #F0F9FF 0%, #BAE6FD 100%);
        }
        .theme-frutiger .bg-studio-panel {
            /* Degradado de cristal (más brillante arriba, transparente abajo) */
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%) !important;
            /* Efecto esmerilado nativo de Apple */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            /* Sombra interna blanca (borde brillante) y sombra suave oscura (profundidad 3D) */
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), inset 0 -1px 2px rgba(255,255,255,0.3), 0 8px 32px rgba(2, 132, 199, 0.15) !important;
            border: 1px solid rgba(255,255,255,0.5) !important;
        }

        /* Ergonomía táctil para iPad */
        body {
            overscroll-behavior: none;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.5s ease, color 0.3s ease;
        }
        
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pl { padding-left: env(safe-area-inset-left, 20px); }
        .safe-pr { padding-right: env(safe-area-inset-right, 20px); }
        ::-webkit-scrollbar { display: none; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'studio-bg': 'var(--bg-color)',
                        'studio-panel': 'var(--panel-color)',
                        'studio-text': 'var(--text-color)',
                        'studio-muted': 'var(--text-muted)',
                        'studio-accent': 'var(--accent-color)',
                        'studio-border': 'var(--border-color)'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>

<body id="app-container" class="h-screen w-screen overflow-hidden flex font-sans">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bg-studio-panel w-20 flex flex-col items-center py-6 safe-pt safe-pb shadow-lg z-20 transition-all duration-300">
        <button class="mb-10 p-3 rounded-2xl bg-studio-bg shadow-inner text-studio-accent transition-transform active:scale-95">
            <i class="ph ph-paint-brush-broad text-2xl"></i>
        </button>
        <div class="flex flex-col gap-6 w-full items-center">
            <button class="p-3 rounded-xl bg-studio-bg/50 transition-colors shadow-sm" title="Proyectos">
                <i class="ph ph-folders text-2xl text-studio-accent"></i>
            </button>
        </div>
        <div class="mt-auto flex flex-col gap-4">
            <button onclick="openSettings()" class="p-3 rounded-xl hover:bg-studio-bg/30 transition-colors" title="Preferencias">
                <i class="ph ph-gear text-2xl text-studio-muted"></i>
            </button>
        </div>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative h-full safe-pt safe-pb overflow-y-auto px-10 transition-colors duration-300" id="main-view">
        <div class="py-10 h-full flex flex-col">
            <header class="mb-8">
                <h1 class="text-4xl font-light mb-2">Proyectos</h1>
                <p class="text-studio-muted text-sm">Almacenamiento local activo.</p>
            </header>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="projects-grid"></div>
        </div>
    </main>

    <!-- MODAL: NUEVO PROYECTO -->
    <div id="new-project-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-studio-panel w-[500px] rounded-3xl p-8 shadow-2xl border border-studio-border">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-light">Nueva Obra</h2>
                <button onclick="closeModal('new-project-modal')" class="text-studio-muted hover:text-studio-text transition-colors">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>
            <form id="new-project-form" onsubmit="saveProject(event)" class="flex flex-col gap-5">
                <div>
                    <label class="block text-sm text-studio-muted mb-2">Título del Proyecto</label>
                    <input type="text" id="proj-title" required class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 text-studio-text focus:outline-none focus:border-studio-accent transition-colors" placeholder="Ej. Retrato en azul">
                </div>
                <div>
                    <label class="block text-sm text-studio-muted mb-2">Técnica</label>
                    <select id="proj-category" class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 text-studio-text focus:outline-none focus:border-studio-accent appearance-none">
                        <option value="Óleo">Óleo</option>
                        <option value="Acrílico">Acrílico</option>
                        <option value="Grafito / Carbón">Grafito / Carbón</option>
                        <option value="Técnica Mixta">Técnica Mixta</option>
                    </select>
                </div>
                <button type="submit" class="mt-4 bg-studio-accent text-white font-bold rounded-xl p-4 transition-colors active:scale-95 shadow-lg">
                    Crear Proyecto
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: PREFERENCIAS DEL ESTUDIO -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-studio-panel w-[500px] rounded-3xl p-8 shadow-2xl border border-studio-border">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-light">Preferencias del Estudio</h2>
                <button onclick="closeModal('settings-modal')" class="text-studio-muted hover:text-studio-text transition-colors">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>
            
            <div class="flex flex-col gap-6">
                <!-- Ergonomía -->
                <div>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-studio-muted mb-3">Ergonomía</h3>
                    <div class="flex gap-4">
                        <label class="flex-1 flex items-center justify-center gap-2 p-4 border border-studio-border rounded-xl cursor-pointer hover:border-studio-accent transition-colors">
                            <input type="radio" name="ergonomics" value="right" class="accent-studio-accent" checked>
                            <span>Diestro</span>
                        </label>
                        <label class="flex-1 flex items-center justify-center gap-2 p-4 border border-studio-border rounded-xl cursor-pointer hover:border-studio-accent transition-colors">
                            <input type="radio" name="ergonomics" value="left" class="accent-studio-accent">
                            <span>Zurdo</span>
                        </label>
                    </div>
                </div>

                <!-- Iluminación / Temas -->
                <div>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-studio-muted mb-3">Entorno Visual</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center gap-2 p-3 border border-studio-border rounded-xl cursor-pointer hover:border-studio-accent transition-colors">
                            <input type="radio" name="theme" value="neutral" class="accent-studio-accent" checked>
                            <span class="text-sm font-medium">Gris Neutro</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border border-studio-border rounded-xl cursor-pointer hover:border-studio-accent transition-colors">
                            <input type="radio" name="theme" value="daylight" class="accent-studio-accent">
                            <span class="text-sm font-medium">Luz de Día</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border border-studio-border rounded-xl cursor-pointer hover:border-studio-accent transition-colors">
                            <input type="radio" name="theme" value="warm" class="accent-studio-accent">
                            <span class="text-sm font-medium">Luz Cálida</span>
                        </label>
                        <!-- NUEVA OPCIÓN: FRUTIGER AERO -->
                        <label class="flex items-center gap-2 p-3 border border-studio-accent rounded-xl cursor-pointer hover:bg-white/10 transition-colors bg-gradient-to-br from-blue-100/20 to-transparent">
                            <input type="radio" name="theme" value="frutiger" class="accent-studio-accent">
                            <span class="text-sm font-medium text-blue-500">Aero Glass ✨</span>
                        </label>
                    </div>
                </div>
                
                <button onclick="applyAndSaveSettings()" class="mt-4 bg-studio-accent text-white font-bold rounded-xl p-4 transition-colors active:scale-95 shadow-lg">
                    Aplicar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        const db = new Dexie("StudioArtDB");
        db.version(1).stores({
            projects: '++id, title, category, dateCreated',
            references: '++id, projectId, imageBlob',
            sketches: '++id, projectId, canvasData'
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadPreferences();
            loadProjects();
        });

        function loadPreferences() {
            const savedTheme = localStorage.getItem('studioTheme') || 'neutral';
            const isLeftHanded = localStorage.getItem('isLeftHanded') === 'true';

            applyThemeVisuals(savedTheme, isLeftHanded);
            
            document.querySelector(`input[name="theme"][value="${savedTheme}"]`).checked = true;
            document.querySelector(`input[name="ergonomics"][value="${isLeftHanded ? 'left' : 'right'}"]`).checked = true;
        }

        function applyThemeVisuals(theme, isLeftHanded) {
            document.documentElement.className = '';
            if (theme !== 'neutral') {
                document.documentElement.classList.add(`theme-${theme}`);
            }

            const appContainer = document.getElementById('app-container');
            if (isLeftHanded) {
                appContainer.classList.add('flex-row-reverse');
                document.querySelector('nav').classList.replace('safe-pl', 'safe-pr');
            } else {
                appContainer.classList.remove('flex-row-reverse');
                document.querySelector('nav').classList.replace('safe-pr', 'safe-pl');
            }
        }

        function applyAndSaveSettings() {
            const selectedTheme = document.querySelector('input[name="theme"]:checked').value;
            const isLeftHanded = document.querySelector('input[name="ergonomics"]:checked').value === 'left';

            localStorage.setItem('studioTheme', selectedTheme);
            localStorage.setItem('isLeftHanded', isLeftHanded);

            applyThemeVisuals(selectedTheme, isLeftHanded);
            closeModal('settings-modal');
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            if(modalId === 'new-project-modal') document.getElementById('proj-title').focus();
        }
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            if(modalId === 'new-project-modal') document.getElementById('new-project-form').reset();
        }

        async function saveProject(event) {
            event.preventDefault();
            await db.projects.add({
                title: document.getElementById('proj-title').value,
                category: document.getElementById('proj-category').value,
                dateCreated: new Date().toISOString()
            });
            closeModal('new-project-modal');
            loadProjects();
        }

        async function loadProjects() {
            const projects = await db.projects.toArray();
            const grid = document.getElementById('projects-grid');
            
            grid.innerHTML = `
                <button class="bg-studio-panel border-2 border-dashed border-studio-border rounded-3xl h-56 flex flex-col items-center justify-center hover:border-studio-accent transition-all group" onclick="openModal('new-project-modal')">
                    <div class="bg-studio-bg p-4 rounded-full mb-4 shadow-inner transition-colors">
                        <i class="ph ph-plus text-3xl text-studio-muted group-hover:text-studio-accent"></i>
                    </div>
                    <span class="text-studio-muted font-medium group-hover:text-studio-text">Nuevo Proyecto</span>
                </button>
            `;

            projects.forEach(project => {
                const date = new Date(project.dateCreated).toLocaleDateString('es-ES');
                grid.innerHTML += `
                    <div class="bg-studio-panel border border-studio-border rounded-3xl h-56 p-6 flex flex-col hover:ring-2 ring-studio-accent cursor-pointer transition-all shadow-lg group" onclick="openProject(${project.id})">
                        <div class="flex justify-between items-start mb-auto">
                            <span class="text-xs font-semibold uppercase tracking-wider text-white bg-studio-accent px-3 py-1 rounded-full shadow-sm">${project.category}</span>
                            <button class="text-studio-muted opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-400" onclick="deleteProject(event, ${project.id})">
                                <i class="ph ph-trash text-xl"></i>
                            </button>
                        </div>
                        <div>
                            <h2 class="text-xl font-medium text-studio-text mb-1 truncate">${project.title}</h2>
                            <p class="text-studio-muted text-sm">Creado: ${date}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function deleteProject(event, id) {
            event.stopPropagation();
            if(confirm("¿Eliminar este proyecto de forma permanente?")) {
                await db.projects.delete(id);
                loadProjects();
            }
        }

        function openProject(id) {
            alert("Siguiente paso: Interior del proyecto ID " + id);
        }
    </script>
</body>
</html>
