<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Estudio Espacial</title>

    <style>
        /* Variables reactivas al Drag and Drop */
        :root { 
            --bg-color: #2E2E2E; 
            --panel-color: #3A3A3A; 
            --text-color: #E0E0E0; 
            --accent-color: #60A5FA; 
            --border-color: rgba(255, 255, 255, 0.1); 
        }
        
        body { 
            overscroll-behavior: none; 
            touch-action: none; /* Bloqueo estricto para permitir el motor espacial */
            -webkit-user-select: none; 
            user-select: none; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            transition: background-color 0.4s ease;
        }

        .safe-pt { padding-top: env(safe-area-inset-top, 20px); } 
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); } 
        
        /* Clase vital para el elemento que viaja con el dedo/lápiz */
        .dragging-node {
            position: fixed;
            pointer-events: none; /* Permite calcular qué hay DEBAJO de la esfera */
            z-index: 9999;
            transform: translate(-50%, -50%) scale(1.2);
            transition: transform 0.1s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Feedback visual al pasar un color por encima */
        .paint-hover {
            filter: brightness(1.3);
            outline: 2px dashed var(--accent-color);
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'studio-bg': 'var(--bg-color)', 'studio-panel': 'var(--panel-color)', 'studio-text': 'var(--text-color)', 'studio-accent': 'var(--accent-color)', 'studio-border': 'var(--border-color)' } } } }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="h-screen w-screen overflow-hidden flex font-sans" id="app-body">

    <!-- ÁREA 1: BARRA LATERAL (Data Target: Panel) -->
    <nav data-paint-target="panel" class="bg-studio-panel w-24 flex flex-col items-center py-6 safe-pt safe-pb shadow-2xl z-20 border-r border-studio-border transition-colors duration-500">
        <div data-paint-target="accent" class="mb-8 p-3 rounded-2xl bg-studio-bg shadow-inner text-studio-accent transition-colors duration-500">
            <i class="ph ph-paint-brush-broad text-2xl"></i>
        </div>
        
        <div class="mt-auto flex flex-col gap-4">
            <!-- Botón para abrir el Laboratorio de Color -->
            <button onclick="toggleColorLab()" class="p-3 rounded-xl hover:bg-studio-bg text-studio-text transition-colors">
                <i class="ph ph-palette text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- ÁREA 2: LIENZO PRINCIPAL (Data Target: Fondo) -->
    <main data-paint-target="background" class="flex-1 relative h-full safe-pt safe-pb overflow-y-auto px-12 transition-colors duration-500">
        
        <div class="h-full flex flex-col justify-center items-center">
            <h1 class="text-4xl font-light mb-4 text-studio-text">Arrastra y Suelta</h1>
            <p class="text-gray-400 max-w-md text-center">Abre el panel de color (abajo a la izquierda). Arrastra una esfera hacia el fondo para cambiar la pared, hacia la barra lateral para cambiar los paneles, o hacia un botón para cambiar los acentos.</p>
            
            <!-- Ejemplo de panel interno (Data Target: Panel) -->
            <div data-paint-target="panel" class="mt-12 bg-studio-panel w-96 h-64 rounded-3xl shadow-xl flex items-center justify-center border border-studio-border transition-colors duration-500">
                <button data-paint-target="accent" class="bg-studio-accent px-6 py-3 rounded-xl text-white font-bold transition-colors duration-500">Botón de Acento</button>
            </div>
        </div>

    </main>

    <!-- VENTANA FLOTANTE: LABORATORIO DE COLOR (Milanote Style) -->
    <div id="color-lab" class="hidden fixed bottom-10 left-32 bg-studio-panel p-6 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-studio-border z-50">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm tracking-widest uppercase">Laboratorio Visual</h3>
            <i class="ph ph-arrows-out-cardinal text-gray-400 cursor-move" title="Pronto haremos esta ventana movible también"></i>
        </div>
        
        <!-- Esferas de Color (Draggables nativos desactivados, usamos PointerEvents) -->
        <div class="flex gap-4" id="color-palette">
            <!-- Tonos neutros/oscuros (Ideales para fondos) -->
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner color-sphere" style="background-color: #1A1A1A;" data-color="#1A1A1A" data-type="dark"></div>
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner color-sphere" style="background-color: #36302D;" data-color="#36302D" data-type="dark"></div>
            
            <!-- Tonos claros (Ideales para paneles/luz) -->
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner border border-gray-500 color-sphere" style="background-color: #E5E7EB;" data-color="#E5E7EB" data-type="light"></div>
            
            <!-- Tonos vibrantes (Ideales para acentos) -->
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner color-sphere" style="background-color: #F59E0B;" data-color="#F59E0B" data-type="accent"></div>
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner color-sphere" style="background-color: #10B981;" data-color="#10B981" data-type="accent"></div>
            <div class="w-10 h-10 rounded-full cursor-grab shadow-inner color-sphere" style="background-color: #8B5CF6;" data-color="#8B5CF6" data-type="accent"></div>
        </div>
    </div>

    <!-- MOTOR DE FÍSICAS (POINTER EVENTS) -->
    <script>
        function toggleColorLab() {
            const lab = document.getElementById('color-lab');
            lab.classList.toggle('hidden');
        }

        // ==========================================
        // MOTOR DRAG AND DROP ESPACIAL (Pencil / Touch)
        // ==========================================
        let activeSphere = null; // El elemento clonado que se mueve
        let currentTarget = null; // El elemento UI sobre el que estamos flotando

        const spheres = document.querySelectorAll('.color-sphere');

        spheres.forEach(sphere => {
            // pointerdown equivale a tocar la pantalla o hacer clic
            sphere.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // Evita comportamientos nativos de iOS
                
                // 1. Crear el clon visual que seguirá al dedo
                activeSphere = sphere.cloneNode(true);
                activeSphere.classList.add('dragging-node');
                document.body.appendChild(activeSphere);

                // 2. Moverlo inmediatamente a las coordenadas del toque
                moveSphere(e.clientX, e.clientY);

                // 3. Activar los listeners globales mientras se arrastra
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
            });
        });

        function moveSphere(x, y) {
            if(activeSphere) {
                activeSphere.style.left = `${x}px`;
                activeSphere.style.top = `${y}px`;
            }
        }

        function onPointerMove(e) {
            moveSphere(e.clientX, e.clientY);

            // DETECCIÓN DE COLISIÓN (Hit Testing)
            // ¿Qué elemento de la UI hay debajo de la coordenada exacta (x, y)?
            const elementsUnderPointer = document.elementsFromPoint(e.clientX, e.clientY);
            
            // Buscar el primer elemento que tenga el atributo 'data-paint-target'
            const target = elementsUnderPointer.find(el => el.hasAttribute('data-paint-target'));

            // Feedback visual (resaltar la zona)
            if (currentTarget && currentTarget !== target) {
                currentTarget.classList.remove('paint-hover');
            }
            if (target) {
                target.classList.add('paint-hover');
                currentTarget = target;
            } else {
                currentTarget = null;
            }
        }

        function onPointerUp(e) {
            // Limpiar eventos globales
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);

            // Quitar el feedback visual
            if(currentTarget) {
                currentTarget.classList.remove('paint-hover');
                
                // APLICAR EL COLOR LÓGICAMENTE
                const colorCode = activeSphere.dataset.color;
                const targetType = currentTarget.getAttribute('data-paint-target');
                
                applyPaint(targetType, colorCode);
                currentTarget = null;
            }

            // Destruir el clon flotante
            if(activeSphere) {
                activeSphere.remove();
                activeSphere = null;
            }
        }

        // ==========================================
        // SISTEMA INTELIGENTE DE CONTRASTE
        // ==========================================
        function applyPaint(targetType, colorCode) {
            const root = document.documentElement;

            if (targetType === 'background') {
                root.style.setProperty('--bg-color', colorCode);
                // Si el fondo es muy claro, forzar texto oscuro para no romper legibilidad
                if(colorCode === '#E5E7EB') root.style.setProperty('--text-color', '#111827');
                else root.style.setProperty('--text-color', '#E0E0E0');
            } 
            else if (targetType === 'panel') {
                root.style.setProperty('--panel-color', colorCode);
            } 
            else if (targetType === 'accent') {
                root.style.setProperty('--accent-color', colorCode);
            }

            // Aquí agregaríamos la línea para guardarlo en localStorage 
            // localStorage.setItem(`theme_${targetType}`, colorCode);
        }
    </script>
</body>
</html>
