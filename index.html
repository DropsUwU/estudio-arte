<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Estudio Espacial</title>

    <style>
        :root { --bg-color: #2E2E2E; --panel-color: #3A3A3A; --text-color: #E0E0E0; --text-muted: #9CA3AF; --accent-color: #60A5FA; --border-color: rgba(255, 255, 255, 0.1); }
        body { overscroll-behavior: none; touch-action: pan-y; -webkit-user-select: none; user-select: none; background-color: var(--bg-color); color: var(--text-color); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); } .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        ::-webkit-scrollbar { display: none; }
        
        /* Animación para el Orbe de Ideas */
        .glow-pulse { animation: pulse 3s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); } 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); } }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'studio-bg': 'var(--bg-color)', 'studio-panel': 'var(--panel-color)', 'studio-text': 'var(--text-color)', 'studio-muted': 'var(--text-muted)', 'studio-accent': 'var(--accent-color)', 'studio-border': 'var(--border-color)' } } } }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>

<body class="h-screen w-screen overflow-hidden flex font-sans">

    <!-- BARRA LATERAL DINÁMICA -->
    <nav class="bg-studio-panel w-24 flex flex-col items-center py-6 safe-pt safe-pb shadow-2xl z-20">
        <div class="mb-8 p-3 rounded-2xl bg-studio-bg shadow-inner text-studio-accent">
            <i class="ph ph-paint-brush-broad text-2xl"></i>
        </div>
        
        <div id="workspace-list" class="flex flex-col gap-4 w-full items-center overflow-y-auto no-scrollbar"></div>

        <button onclick="openSpaceModal()" class="mt-4 p-3 rounded-xl border border-dashed border-studio-muted text-studio-muted hover:border-studio-accent hover:text-studio-accent transition-colors" title="Crear Nuevo Espacio">
            <i class="ph ph-plus text-xl"></i>
        </button>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative h-full safe-pt safe-pb overflow-y-auto px-12" id="main-view">
        
        <div id="active-workspace-view" class="hidden h-full flex flex-col py-10">
            <!-- Cabecera del Espacio con Controles de Edición -->
            <header class="mb-10 flex justify-between items-end border-b border-studio-border pb-6 group">
                <div class="flex items-center gap-4">
                    <div id="active-space-icon-container" class="w-16 h-16 rounded-2xl bg-studio-panel flex items-center justify-center text-studio-accent text-3xl shadow-inner overflow-hidden border border-studio-border">
                        <!-- Icono o Imagen inyectado por JS -->
                    </div>
                    <div>
                        <h1 id="active-space-title" class="text-4xl font-light mb-1">Cargando...</h1>
                        <p class="text-studio-muted text-sm">Espacio de trabajo activo</p>
                    </div>
                </div>
                
                <!-- Botones de Gestión (Aparecen sutilmente) -->
                <div class="flex gap-3 opacity-50 hover:opacity-100 transition-opacity">
                    <button onclick="editCurrentSpace()" class="p-3 bg-studio-panel rounded-xl border border-studio-border text-studio-text hover:text-studio-accent transition-colors">
                        <i class="ph ph-pencil-simple text-xl"></i>
                    </button>
                    <button onclick="deleteCurrentSpace()" class="p-3 bg-studio-panel rounded-xl border border-studio-border text-studio-text hover:text-red-400 transition-colors">
                        <i class="ph ph-trash text-xl"></i>
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="projects-grid">
                <button class="bg-studio-panel border-2 border-dashed border-studio-border rounded-3xl h-56 flex flex-col items-center justify-center hover:border-studio-accent transition-all group" onclick="alert('Próximo módulo: Creación de obras y lienzo espacial.')">
                    <div class="bg-studio-bg p-4 rounded-full mb-4 text-studio-muted group-hover:text-studio-accent"><i class="ph ph-plus text-3xl"></i></div>
                    <span class="text-studio-muted font-medium group-hover:text-studio-text">Nuevo Proyecto</span>
                </button>
            </div>
        </div>
    </main>

    <!-- EL ORBE FLOTANTE (Idea Rápida) -->
    <button onclick="openIdeaModal()" class="fixed bottom-10 right-10 w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center text-studio-bg shadow-lg glow-pulse hover:scale-110 transition-transform z-40" title="Capturar Idea Fugaz">
        <i class="ph ph-lightning text-3xl"></i>
    </button>

    <!-- MODAL: GESTIÓN DE ESPACIO (Crear/Editar) -->
    <div id="space-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-studio-panel w-[450px] rounded-3xl p-8 border border-studio-border shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="space-modal-title" class="text-2xl font-light">Nuevo Espacio</h2>
                <button onclick="closeModal('space-modal')" class="text-studio-muted hover:text-white"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <form onsubmit="saveSpace(event)" class="flex flex-col gap-6">
                <input type="hidden" id="space-id" value="">
                
                <div>
                    <label class="block text-sm text-studio-muted mb-2">Nombre del Espacio</label>
                    <input type="text" id="space-name" required class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 text-white focus:outline-none focus:border-studio-accent" placeholder="Ej: Comisiones 2026">
                </div>
                
                <div>
                    <label class="block text-sm text-studio-muted mb-3">Identidad Visual</label>
                    
                    <!-- Tabs para elegir tipo de icono -->
                    <div class="flex bg-studio-bg p-1 rounded-xl mb-4 border border-studio-border">
                        <button type="button" onclick="setVisualType('icon')" id="tab-icon" class="flex-1 py-2 rounded-lg bg-studio-panel text-white text-sm font-medium transition-colors">Ícono</button>
                        <button type="button" onclick="setVisualType('image')" id="tab-image" class="flex-1 py-2 rounded-lg text-studio-muted text-sm font-medium transition-colors">Imagen</button>
                    </div>
                    <input type="hidden" id="space-visual-type" value="icon">
                    <input type="hidden" id="space-visual-value" value="ph-folder">

                    <!-- Opción A: Selector de Íconos -->
                    <div id="panel-icon" class="grid grid-cols-5 gap-2">
                        <!-- Generados por JS -->
                    </div>

                    <!-- Opción B: Subida de Imagen -->
                    <div id="panel-image" class="hidden flex flex-col items-center justify-center p-6 border-2 border-dashed border-studio-border rounded-xl bg-studio-bg">
                        <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                        <img id="image-preview" src="" class="hidden w-20 h-20 object-cover rounded-xl mb-4 border border-studio-border shadow-md">
                        <button type="button" onclick="document.getElementById('image-upload').click()" class="px-4 py-2 bg-studio-panel rounded-lg text-studio-text hover:text-studio-accent transition-colors text-sm border border-studio-border">
                            <i class="ph ph-upload-simple mr-2"></i>Seleccionar Foto
                        </button>
                        <p class="text-xs text-studio-muted mt-2 text-center">La imagen se guardará localmente.</p>
                    </div>
                </div>

                <button type="submit" class="mt-2 bg-studio-accent text-white font-bold rounded-xl p-4 active:scale-95 transition-transform">Guardar Espacio</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CAPTURA RÁPIDA -->
    <div id="idea-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-start justify-center pt-32">
        <div class="bg-studio-panel w-[500px] rounded-3xl p-6 shadow-[0_15px_40px_rgba(234,179,8,0.15)] border border-yellow-500/30">
            <h2 class="text-xl text-yellow-500 flex items-center gap-2 mb-4"><i class="ph ph-lightning"></i> Idea Fugaz</h2>
            <textarea id="idea-text" rows="3" placeholder="Anota el concepto antes de que desaparezca..." class="w-full bg-studio-bg border border-studio-border rounded-xl p-4 focus:border-yellow-500 outline-none resize-none text-lg text-white"></textarea>
            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeModal('idea-modal')" class="px-4 py-2 text-studio-muted hover:text-white">Descartar</button>
                <button onclick="saveIdea()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-xl active:scale-95 shadow-md hover:bg-yellow-400">Archivar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. BASE DE DATOS Y ESTADO
        // ==========================================
        const db = new Dexie("StudioArt_Engine"); 
        db.version(1).stores({
            workspaces: '++id, name, visualType, visualValue', 
            projects: '++id, workspaceId, title, type' // type: 'project' o 'idea'
        });

        let currentWorkspaceId = null;
        const availableIcons = ['ph-folder', 'ph-palette', 'ph-scribble-loop', 'ph-image-square', 'ph-star', 'ph-heart', 'ph-briefcase', 'ph-coffee', 'ph-moon', 'ph-cube'];

        window.addEventListener('DOMContentLoaded', async () => {
            renderIconSelector();
            await checkFirstRun();
            await loadWorkspaces();
        });

        // Crea un espacio de "Ideas" por defecto si la app está vacía
        async function checkFirstRun() {
            const count = await db.workspaces.count();
            if (count === 0) {
                await db.workspaces.add({ name: 'Caja de Ideas', visualType: 'icon', visualValue: 'ph-lightbulb' });
                await db.workspaces.add({ name: 'Proyectos Personales', visualType: 'icon', visualValue: 'ph-folder' });
            }
        }

        // ==========================================
        // 2. GESTIÓN VISUAL DEL MODAL DE ESPACIOS
        // ==========================================
        function setVisualType(type) {
            document.getElementById('space-visual-type').value = type;
            if (type === 'icon') {
                document.getElementById('tab-icon').className = "flex-1 py-2 rounded-lg bg-studio-panel text-white text-sm font-medium transition-colors shadow-sm";
                document.getElementById('tab-image').className = "flex-1 py-2 rounded-lg text-studio-muted text-sm font-medium transition-colors hover:text-white";
                document.getElementById('panel-icon').classList.remove('hidden');
                document.getElementById('panel-image').classList.add('hidden');
            } else {
                document.getElementById('tab-image').className = "flex-1 py-2 rounded-lg bg-studio-panel text-white text-sm font-medium transition-colors shadow-sm";
                document.getElementById('tab-icon').className = "flex-1 py-2 rounded-lg text-studio-muted text-sm font-medium transition-colors hover:text-white";
                document.getElementById('panel-image').classList.remove('hidden');
                document.getElementById('panel-image').classList.add('flex');
                document.getElementById('panel-icon').classList.add('hidden');
            }
        }

        function renderIconSelector() {
            const container = document.getElementById('panel-icon');
            container.innerHTML = availableIcons.map(icon => `
                <button type="button" onclick="selectIcon('${icon}')" id="btn-icon-${icon}" class="p-3 bg-studio-bg rounded-xl border border-studio-border hover:border-studio-accent text-xl text-studio-muted transition-colors flex items-center justify-center">
                    <i class="ph ${icon}"></i>
                </button>
            `).join('');
            selectIcon('ph-folder'); 
        }

        function selectIcon(iconName) {
            document.getElementById('space-visual-value').value = iconName;
            availableIcons.forEach(ic => {
                const btn = document.getElementById(`btn-icon-${ic}`);
                if(ic === iconName) {
                    btn.classList.add('border-studio-accent', 'text-studio-accent', 'bg-studio-panel');
                    btn.classList.remove('border-studio-border', 'text-studio-muted', 'bg-studio-bg');
                } else {
                    btn.classList.remove('border-studio-accent', 'text-studio-accent', 'bg-studio-panel');
                    btn.classList.add('border-studio-border', 'text-studio-muted', 'bg-studio-bg');
                }
            });
        }

        // Convierte la imagen a Base64 para guardarla fácilmente en la base de datos
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('space-visual-value').value = base64;
                
                const preview = document.getElementById('image-preview');
                preview.src = base64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // 3. CRUD DE ESPACIOS DE TRABAJO
        // ==========================================
        function openSpaceModal(editMode = false) {
            document.getElementById('space-modal').classList.remove('hidden');
            if (!editMode) {
                document.getElementById('space-modal-title').innerText = "Nuevo Espacio";
                document.getElementById('space-id').value = "";
                document.getElementById('space-name').value = "";
                document.getElementById('image-preview').classList.add('hidden');
                setVisualType('icon');
            }
        }

        async function editCurrentSpace() {
            if(!currentWorkspaceId) return;
            const space = await db.workspaces.get(currentWorkspaceId);
            
            document.getElementById('space-modal-title').innerText = "Editar Espacio";
            document.getElementById('space-id').value = space.id;
            document.getElementById('space-name').value = space.name;
            
            setVisualType(space.visualType);
            if(space.visualType === 'icon') {
                selectIcon(space.visualValue);
            } else {
                document.getElementById('space-visual-value').value = space.visualValue;
                const preview = document.getElementById('image-preview');
                preview.src = space.visualValue;
                preview.classList.remove('hidden');
            }
            openSpaceModal(true);
        }

        async function saveSpace(event) {
            event.preventDefault();
            const id = document.getElementById('space-id').value;
            const data = {
                name: document.getElementById('space-name').value,
                visualType: document.getElementById('space-visual-type').value,
                visualValue: document.getElementById('space-visual-value').value
            };

            if (id) {
                await db.workspaces.update(parseInt(id), data);
            } else {
                currentWorkspaceId = await db.workspaces.add(data);
            }
            
            closeModal('space-modal');
            await loadWorkspaces();
        }

        async function deleteCurrentSpace() {
            if(!currentWorkspaceId) return;
            if(confirm("¿Estás seguro de eliminar este espacio y TODO su contenido?")) {
                await db.projects.where('workspaceId').equals(currentWorkspaceId).delete();
                await db.workspaces.delete(currentWorkspaceId);
                
                const remaining = await db.workspaces.toArray();
                currentWorkspaceId = remaining.length > 0 ? remaining[0].id : null;
                await loadWorkspaces();
            }
        }

        async function loadWorkspaces() {
            const spaces = await db.workspaces.toArray();
            const list = document.getElementById('workspace-list');
            
            list.innerHTML = spaces.map(space => {
                const isActive = space.id === currentWorkspaceId;
                const activeClasses = isActive ? 'ring-2 ring-studio-accent text-studio-accent shadow-md' : 'text-studio-muted hover:text-white opacity-60 hover:opacity-100';
                
                // Generar el HTML del icono (imagen o icono vectorial)
                let visualHtml = space.visualType === 'image' 
                    ? `<img src="${space.visualValue}" class="w-full h-full object-cover rounded-xl">`
                    : `<i class="ph ${space.visualValue} text-2xl"></i>`;

                return `
                <button onclick="activateWorkspace(${space.id})" class="relative w-14 h-14 rounded-xl flex items-center justify-center transition-all group ${activeClasses}" title="${space.name}">
                    ${visualHtml}
                    <span class="absolute left-16 bg-black text-white text-xs px-3 py-2 rounded-lg opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 shadow-xl border border-white/10">${space.name}</span>
                </button>
                `;
            }).join('');

            if (currentWorkspaceId) activateWorkspace(currentWorkspaceId);
            else if (spaces.length > 0) activateWorkspace(spaces[0].id);
            else document.getElementById('active-workspace-view').classList.add('hidden');
        }

        async function activateWorkspace(id) {
            currentWorkspaceId = id;
            const space = await db.workspaces.get(id);
            if(!space) return;

            document.getElementById('active-workspace-view').classList.remove('hidden');
            document.getElementById('active-space-title').innerText = space.name;
            
            const iconContainer = document.getElementById('active-space-icon-container');
            iconContainer.innerHTML = space.visualType === 'image'
                ? `<img src="${space.visualValue}" class="w-full h-full object-cover">`
                : `<i class="ph ${space.visualValue}"></i>`;

            // Refrescar estilos de la lista sin recargarla toda
            const buttons = document.getElementById('workspace-list').children;
            for(let i=0; i<buttons.length; i++) {
                // Lógica de clases gestionada en loadWorkspaces, para simplificar llamamos loadWorkspaces pero evitamos bucle infinito
            }
            // Pequeño hack: re-renderizamos la lista para actualizar los anillos de selección
            const spaces = await db.workspaces.toArray();
            document.getElementById('workspace-list').innerHTML = spaces.map(s => {
                const isActive = s.id === id;
                const activeClasses = isActive ? 'ring-2 ring-studio-accent text-studio-accent bg-studio-panel shadow-md' : 'text-studio-muted hover:text-white hover:bg-studio-panel/50';
                let visualHtml = s.visualType === 'image' ? `<img src="${s.visualValue}" class="w-full h-full object-cover rounded-xl">` : `<i class="ph ${s.visualValue} text-2xl"></i>`;
                return `<button onclick="activateWorkspace(${s.id})" class="relative w-14 h-14 rounded-xl flex items-center justify-center transition-all group ${activeClasses}" title="${s.name}">${visualHtml}</button>`;
            }).join('');
        }

        // ==========================================
        // 4. CAPTURA DE IDEAS FUGACES
        // ==========================================
        function openIdeaModal() {
            document.getElementById('idea-modal').classList.remove('hidden');
            document.getElementById('idea-text').focus();
        }

        async function saveIdea() {
            const text = document.getElementById('idea-text').value;
            if(!text.trim()) return;

            // Busca el espacio llamado "Caja de Ideas", si no existe lo guarda en el actual
            const spaces = await db.workspaces.where('name').equals('Caja de Ideas').toArray();
            const targetWorkspaceId = spaces.length > 0 ? spaces[0].id : currentWorkspaceId;

            await db.projects.add({
                workspaceId: targetWorkspaceId,
                title: text,
                type: 'idea'
            });

            closeModal('idea-modal');
            document.getElementById('idea-text').value = '';
            
            // Animación visual de éxito en el orbe
            const orbe = document.querySelector('.glow-pulse');
            orbe.classList.replace('bg-yellow-500', 'bg-green-500');
            orbe.innerHTML = '<i class="ph ph-check text-3xl"></i>';
            setTimeout(() => {
                orbe.classList.replace('bg-green-500', 'bg-yellow-500');
                orbe.innerHTML = '<i class="ph ph-lightning text-3xl"></i>';
            }, 1000);
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
