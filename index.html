<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Estudio Fluido</title>

    <style>
        /* MOTOR DE VARIABLES (Inspirado en la imagen de referencia) */
        :root { 
            --bg-canvas: #1A1A1A; /* Fondo exterior oscuro/desenfocado */
            --ui-base: #F3EFEA;   /* Color crema del contenedor principal */
            --ui-widget: #FFFFFF; /* Cajas interiores blancas */
            --text-main: #2D2D2D; 
            --text-muted: #8A8580;
            --accent: #FF2A85;    /* Rosa vibrante de tu referencia */
        }

        body { 
            overscroll-behavior: none; 
            touch-action: pan-y; 
            -webkit-user-select: none; 
            user-select: none; 
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at 80% 20%, rgba(255, 42, 133, 0.15), transparent 40%), 
                              radial-gradient(circle at 20% 80%, rgba(243, 239, 234, 0.1), transparent 40%);
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ANIMACIONES FLUIDAS (Elasticidad tipo Apple) */
        .bento-enter {
            animation: bentoPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }
        
        /* Retrasos escalonados para que las cajas aparezcan una por una */
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }

        @keyframes bentoPop {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Hover elástico para botones y tarjetas */
        .squishy:active { transform: scale(0.95); transition: transform 0.1s; }
        .hover-float:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        /* Contenedor principal flotante */
        #app-frame {
            width: 92vw;
            height: 92vh;
            background-color: var(--ui-base);
            border-radius: 3rem; /* Bordes extremadamente curvos */
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            display: flex;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Ocultar scrollbars pero permitir scroll fluido */
        ::-webkit-scrollbar { display: none; }
        .scroll-smooth { -webkit-overflow-scrolling: touch; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        'bento-base': 'var(--ui-base)', 
                        'bento-widget': 'var(--ui-widget)', 
                        'bento-text': 'var(--text-main)', 
                        'bento-muted': 'var(--text-muted)', 
                        'bento-accent': 'var(--accent)' 
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '3rem'
                    }
                } 
            } 
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>

<body>

    <!-- PALETA DE COLORES EXTERIOR (Como en tu imagen) -->
    <div class="fixed left-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-50">
        <button onclick="changeAccent('#FF2A85')" class="w-12 h-12 rounded-[1rem] bg-[#FF2A85] shadow-lg squishy border-2 border-white/20 transition-transform hover:scale-110"></button>
        <button onclick="changeAccent('#8B5CF6')" class="w-12 h-12 rounded-[1rem] bg-[#8B5CF6] shadow-lg squishy border-2 border-white/20 transition-transform hover:scale-110"></button>
        <button onclick="changeAccent('#F59E0B')" class="w-12 h-12 rounded-[1rem] bg-[#F59E0B] shadow-lg squishy border-2 border-white/20 transition-transform hover:scale-110"></button>
        <button onclick="changeAccent('#10B981')" class="w-12 h-12 rounded-[1rem] bg-[#10B981] shadow-lg squishy border-2 border-white/20 transition-transform hover:scale-110"></button>
    </div>

    <!-- CONTENEDOR PRINCIPAL TIPO IPAD -->
    <div id="app-frame">
        
        <!-- BARRA LATERAL (Integrada, no pegada al borde) -->
        <nav class="w-28 p-6 flex flex-col items-center border-r border-black/5">
            <div class="w-16 h-16 rounded-full bg-bento-widget shadow-sm flex items-center justify-center text-bento-accent mb-8 bento-enter">
                <i class="ph ph-paint-brush-broad text-3xl"></i>
            </div>
            
            <div id="workspace-list" class="flex flex-col gap-4 w-full items-center">
                <!-- Se inyectan los espacios -->
            </div>

            <button onclick="openSpaceModal()" class="mt-4 w-12 h-12 rounded-full border-2 border-dashed border-bento-muted text-bento-muted hover:border-bento-accent hover:text-bento-accent transition-colors flex items-center justify-center squishy bento-enter delay-2">
                <i class="ph ph-plus text-xl"></i>
            </button>
        </nav>

        <!-- ÁREA CENTRAL DE TRABAJO (Layout Bento) -->
        <main class="flex-1 p-8 overflow-y-auto scroll-smooth">
            
            <!-- Widget Cabecera del Espacio -->
            <header class="bg-bento-widget rounded-[2.5rem] p-8 shadow-[0_10px_30px_rgba(0,0,0,0.03)] flex justify-between items-center mb-8 bento-enter delay-1">
                <div class="flex items-center gap-6">
                    <div id="active-space-icon-container" class="w-20 h-20 rounded-full bg-bento-base flex items-center justify-center text-bento-accent text-4xl shadow-inner overflow-hidden">
                        <!-- Icono -->
                    </div>
                    <div>
                        <h1 id="active-space-title" class="text-4xl font-bold tracking-tight text-bento-text">Cargando...</h1>
                        <p class="text-bento-muted mt-1 font-medium">Espacio de trabajo</p>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button class="w-14 h-14 rounded-full bg-bento-base text-bento-text hover:bg-black/5 transition-colors flex items-center justify-center squishy">
                        <i class="ph ph-pencil-simple text-2xl"></i>
                    </button>
                    <!-- Botón Destacado Estilo Bento -->
                    <button class="px-8 py-4 rounded-full bg-bento-accent text-white font-bold shadow-lg hover:shadow-xl transition-all hover:-translate-y-1 squishy flex items-center gap-2">
                        <i class="ph ph-plus-circle text-2xl"></i>
                        Nueva Obra
                    </button>
                </div>
            </header>

            <!-- Cuadrícula Bento (Proyectos/Ideas) -->
            <div class="grid grid-cols-12 gap-6" id="projects-grid">
                
                <!-- Widget de Idea Rápida (Reemplaza al orbe flotante para integrar el diseño) -->
                <div class="col-span-12 md:col-span-8 lg:col-span-6 bg-bento-accent text-white rounded-[2.5rem] p-8 shadow-lg bento-enter delay-2 relative overflow-hidden group hover-float transition-all duration-300 cursor-pointer" onclick="openIdeaModal()">
                    <div class="absolute -right-10 -top-10 opacity-20 transform group-hover:scale-110 transition-transform duration-700">
                        <i class="ph-fill ph-lightning text-[15rem]"></i>
                    </div>
                    <div class="relative z-10">
                        <span class="bg-white/20 px-4 py-2 rounded-full text-sm font-bold backdrop-blur-md mb-4 inline-block">Captura Rápida</span>
                        <h2 class="text-3xl font-bold mb-2">¿Tienes una idea?</h2>
                        <p class="text-white/80">Archívala antes de que desaparezca...</p>
                    </div>
                </div>

                <!-- Los proyectos se inyectarán aquí -->
            </div>
        </main>
    </div>

    <!-- MODAL: CAPTURA DE IDEAS (Rediseñado estilo Glassmorphism) -->
    <div id="idea-modal" class="hidden fixed inset-0 bg-black/20 backdrop-blur-xl z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white/80 w-[600px] rounded-[3rem] p-10 shadow-2xl border border-white bento-enter">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-bento-text">Idea Fugaz</h2>
                <button onclick="closeModal('idea-modal')" class="w-12 h-12 rounded-full bg-black/5 text-bento-muted hover:bg-black/10 transition-colors flex items-center justify-center squishy"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <textarea id="idea-text" rows="4" placeholder="Describe tu concepto visual..." class="w-full bg-white border-none rounded-3xl p-6 text-xl text-bento-text shadow-inner resize-none focus:ring-4 ring-bento-accent/30 outline-none transition-all"></textarea>
            <div class="flex justify-end mt-6">
                <button onclick="saveIdea()" class="px-8 py-4 bg-bento-accent text-white font-bold rounded-full squishy shadow-lg hover:shadow-xl transition-all">Archivar Idea</button>
            </div>
        </div>
    </div>

    <!-- MODAL: GESTIÓN DE ESPACIOS -->
    <div id="space-modal" class="hidden fixed inset-0 bg-black/20 backdrop-blur-xl z-50 flex items-center justify-center transition-opacity duration-300">
        <!-- Contenido similar al anterior pero con esquinas extremas y colores crema/blanco -->
        <div class="bg-white/90 w-[500px] rounded-[3rem] p-10 shadow-2xl border border-white bento-enter">
            <h2 class="text-3xl font-bold text-bento-text mb-8">Nuevo Espacio</h2>
            <form onsubmit="saveSpace(event)" class="flex flex-col gap-6">
                <input type="text" id="space-name" required class="w-full bg-black/5 border-none rounded-2xl p-5 text-bento-text text-lg focus:outline-none focus:ring-4 ring-bento-accent/30 transition-all font-medium" placeholder="Nombre del Espacio">
                
                <div class="bg-black/5 p-2 rounded-2xl flex">
                    <button type="button" onclick="setVisualType('icon')" id="tab-icon" class="flex-1 py-3 rounded-xl bg-white text-bento-text font-bold shadow-sm transition-all">Ícono</button>
                    <button type="button" onclick="setVisualType('image')" id="tab-image" class="flex-1 py-3 rounded-xl text-bento-muted font-medium transition-all">Foto</button>
                </div>
                <input type="hidden" id="space-visual-type" value="icon">
                <input type="hidden" id="space-visual-value" value="ph-folder">

                <div id="panel-icon" class="grid grid-cols-5 gap-3"></div>
                <div id="panel-image" class="hidden flex flex-col items-center justify-center p-8 border-2 border-dashed border-bento-muted/30 rounded-2xl bg-black/5">
                    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    <img id="image-preview" src="" class="hidden w-24 h-24 object-cover rounded-2xl mb-4 shadow-md">
                    <button type="button" onclick="document.getElementById('image-upload').click()" class="px-6 py-3 bg-white rounded-full font-bold shadow-sm text-bento-text squishy">Subir Foto</button>
                </div>

                <button type="submit" class="mt-4 bg-bento-accent text-white font-bold rounded-full p-5 shadow-lg squishy text-lg">Guardar</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA (Mantenido intacto funcionalmente, adaptado a los nuevos IDs) -->
    <script>
        const db = new Dexie("StudioArt_Fluid"); 
        db.version(1).stores({ workspaces: '++id, name, visualType, visualValue', projects: '++id, workspaceId, title, type' });
        let currentWorkspaceId = null;
        const availableIcons = ['ph-folder', 'ph-palette', 'ph-scribble-loop', 'ph-image-square', 'ph-star', 'ph-heart', 'ph-briefcase', 'ph-coffee', 'ph-moon', 'ph-cube'];

        window.addEventListener('DOMContentLoaded', async () => {
            renderIconSelector();
            await loadWorkspaces();
        });

        // FUNCIONES DE INTERACTIVIDAD FLUIDA
        function changeAccent(colorHex) {
            document.documentElement.style.setProperty('--accent', colorHex);
            // Pequeña animación del frame principal al cambiar color
            const frame = document.getElementById('app-frame');
            frame.style.transform = 'scale(0.98)';
            setTimeout(() => frame.style.transform = 'scale(1)', 150);
        }

        function openModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            // Reiniciar animación
            const content = modal.querySelector('.bento-enter');
            content.style.animation = 'none';
            content.offsetHeight; /* trigger reflow */
            content.style.animation = null; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
        }

        function openIdeaModal() { openModal('idea-modal'); document.getElementById('idea-text').focus(); }
        function openSpaceModal() { 
            openModal('space-modal'); 
            document.getElementById('space-name').value = ''; 
            document.getElementById('image-preview').classList.add('hidden');
            setVisualType('icon');
        }

        function setVisualType(type) {
            document.getElementById('space-visual-type').value = type;
            if (type === 'icon') {
                document.getElementById('tab-icon').className = "flex-1 py-3 rounded-xl bg-white text-bento-text font-bold shadow-sm transition-all";
                document.getElementById('tab-image').className = "flex-1 py-3 rounded-xl text-bento-muted font-medium transition-all hover:text-bento-text";
                document.getElementById('panel-icon').classList.remove('hidden');
                document.getElementById('panel-image').classList.add('hidden');
                document.getElementById('panel-image').classList.remove('flex');
            } else {
                document.getElementById('tab-image').className = "flex-1 py-3 rounded-xl bg-white text-bento-text font-bold shadow-sm transition-all";
                document.getElementById('tab-icon').className = "flex-1 py-3 rounded-xl text-bento-muted font-medium transition-all hover:text-bento-text";
                document.getElementById('panel-image').classList.remove('hidden');
                document.getElementById('panel-image').classList.add('flex');
                document.getElementById('panel-icon').classList.add('hidden');
            }
        }

        function renderIconSelector() {
            const container = document.getElementById('panel-icon');
            container.innerHTML = availableIcons.map(icon => `
                <button type="button" onclick="selectIcon('${icon}')" id="btn-icon-${icon}" class="w-12 h-12 rounded-xl border-2 border-transparent bg-black/5 hover:bg-black/10 text-2xl text-bento-muted transition-all flex items-center justify-center squishy">
                    <i class="ph ${icon}"></i>
                </button>
            `).join('');
            selectIcon('ph-folder'); 
        }

        function selectIcon(iconName) {
            document.getElementById('space-visual-value').value = iconName;
            availableIcons.forEach(ic => {
                const btn = document.getElementById(`btn-icon-${ic}`);
                if(ic === iconName) {
                    btn.classList.add('bg-white', 'border-bento-accent', 'text-bento-accent', 'shadow-sm');
                    btn.classList.remove('bg-black/5', 'border-transparent', 'text-bento-muted');
                } else {
                    btn.classList.remove('bg-white', 'border-bento-accent', 'text-bento-accent', 'shadow-sm');
                    btn.classList.add('bg-black/5', 'border-transparent', 'text-bento-muted');
                }
            });
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('space-visual-value').value = base64;
                const preview = document.getElementById('image-preview');
                preview.src = base64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function saveSpace(event) {
            event.preventDefault();
            const data = {
                name: document.getElementById('space-name').value,
                visualType: document.getElementById('space-visual-type').value,
                visualValue: document.getElementById('space-visual-value').value
            };
            currentWorkspaceId = await db.workspaces.add(data);
            closeModal('space-modal');
            await loadWorkspaces();
        }

        async function saveIdea() {
            const text = document.getElementById('idea-text').value;
            if(!text.trim()) return;
            await db.projects.add({ workspaceId: currentWorkspaceId, title: text, type: 'idea' });
            closeModal('idea-modal');
            document.getElementById('idea-text').value = '';
            activateWorkspace(currentWorkspaceId); // Recargar
        }

        async function loadWorkspaces() {
            const spaces = await db.workspaces.toArray();
            if(spaces.length === 0) {
                // Autocrear un espacio base para evitar pantalla en blanco en este ejemplo
                currentWorkspaceId = await db.workspaces.add({ name: 'Mi Estudio', visualType: 'icon', visualValue: 'ph-star' });
                return loadWorkspaces();
            }

            const list = document.getElementById('workspace-list');
            list.innerHTML = spaces.map((space, index) => {
                const isActive = space.id === currentWorkspaceId;
                const activeClasses = isActive ? 'bg-bento-widget shadow-md text-bento-accent scale-110' : 'bg-transparent text-bento-muted hover:bg-black/5 hover:scale-105';
                let visualHtml = space.visualType === 'image' 
                    ? `<img src="${space.visualValue}" class="w-full h-full object-cover rounded-full">`
                    : `<i class="ph ${space.visualValue} text-3xl"></i>`;
                
                return `
                <button onclick="activateWorkspace(${space.id})" class="w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 bento-enter delay-${(index % 3) + 1} ${activeClasses}" title="${space.name}">
                    ${visualHtml}
                </button>`;
            }).join('');

            if (!currentWorkspaceId) currentWorkspaceId = spaces[0].id;
            activateWorkspace(currentWorkspaceId);
        }

        async function activateWorkspace(id) {
            currentWorkspaceId = id;
            const space = await db.workspaces.get(id);
            if(!space) return;

            // Actualizar Cabecera
            document.getElementById('active-space-title').innerText = space.name;
            document.getElementById('active-space-icon-container').innerHTML = space.visualType === 'image'
                ? `<img src="${space.visualValue}" class="w-full h-full object-cover">`
                : `<i class="ph ${space.visualValue}"></i>`;

            // Actualizar visualmente la barra lateral sin recargarla
            const buttons = document.getElementById('workspace-list').children;
            const spaces = await db.workspaces.toArray();
            for(let i=0; i<spaces.length; i++) {
                if(spaces[i].id === id) {
                    buttons[i].className = `w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 bg-bento-widget shadow-md text-bento-accent scale-110 squishy`;
                } else {
                    buttons[i].className = `w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 bg-transparent text-bento-muted hover:bg-black/5 hover:scale-105 squishy`;
                }
            }

            // Cargar contenido interno (Ideas archivadas)
            const projectsGrid = document.getElementById('projects-grid');
            const ideas = await db.projects.where('workspaceId').equals(id).toArray();
            
            // Mantenemos la tarjeta fija de "Captura rápida"
            let gridHtml = projectsGrid.firstElementChild.outerHTML; 
            
            // Inyectamos las ideas guardadas
            ideas.forEach((idea, index) => {
                gridHtml += `
                <div class="col-span-12 md:col-span-4 lg:col-span-3 bg-bento-widget rounded-[2.5rem] p-6 shadow-sm hover-float transition-all cursor-pointer bento-enter delay-${(index % 3) + 1} border border-black/5 flex flex-col">
                    <div class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center mb-4">
                        <i class="ph-fill ph-lightning"></i>
                    </div>
                    <p class="text-bento-text font-medium text-lg leading-snug">${idea.title}</p>
                </div>`;
            });
            
            projectsGrid.innerHTML = gridHtml;
        }
    </script>
</body>
</html>
