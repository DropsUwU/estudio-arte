<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <!-- Optimizaciones estrictas para iPad y PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2E2E2E">
    <link rel="manifest" href="manifest.json"> <!-- Requisito para instalación -->
    
    <title>Estudio de Arte</title>

    <!-- Tailwind CSS (Motor de estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración de paleta personalizada para el artista
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'studio-bg': '#2E2E2E',       // Gris neutro de fondo
                        'studio-panel': '#3A3A3A',    // Gris ligeramente más claro para menús
                        'studio-text': '#E0E0E0',     // Texto legible pero sin brillo excesivo
                        'studio-accent': '#60A5FA'    // Azul suave para resaltar acciones
                    }
                }
            }
        }
    </script>

    <!-- Phosphor Icons (Íconos estéticos para la interfaz) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Dexie.js (Motor de Base de Datos Local IndexedDB) -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <style>
        /* Reglas de ergonomía táctil para iPad */
        body {
            overscroll-behavior: none; /* Evita el "efecto liga" al hacer scroll en los bordes */
            touch-action: pan-y; /* Por ahora permite scroll vertical, luego en el canvas bloquearemos esto */
            -webkit-user-select: none; /* Evita que el usuario seleccione texto por accidente */
            user-select: none;
        }
        
        /* Respetar los márgenes físicos del hardware de Apple */
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pl { padding-left: env(safe-area-inset-left, 20px); }
        .safe-pr { padding-right: env(safe-area-inset-right, 20px); }

        /* Ocultar barras de desplazamiento para una vista limpia */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-studio-bg text-studio-text h-screen w-screen overflow-hidden flex font-sans">

    <!-- BARRA DE NAVEGACIÓN LATERAL -->
    <!-- Diseño estrecho y colapsado para no estorbar el lienzo. Funciona para zurdos y diestros si movemos el orden con Flexbox después -->
    <nav class="bg-studio-panel w-20 flex flex-col items-center py-6 safe-pt safe-pb safe-pl shadow-[4px_0_15px_rgba(0,0,0,0.3)] z-20">
        
        <!-- Logo -->
        <button class="mb-10 p-3 rounded-2xl bg-studio-bg shadow-inner text-studio-accent transition-transform active:scale-95" onclick="navigate('home')">
            <i class="ph ph-paint-brush-broad text-2xl"></i>
        </button>

        <!-- Botones de Módulos -->
        <div class="flex flex-col gap-6 w-full items-center">
            <button class="p-3 rounded-xl hover:bg-white/10 transition-colors" title="Proyectos" onclick="navigate('projects')">
                <i class="ph ph-folders text-2xl text-gray-300"></i>
            </button>
            <button class="p-3 rounded-xl hover:bg-white/10 transition-colors" title="Referencias Visuales" onclick="navigate('references')">
                <i class="ph ph-image-square text-2xl text-gray-300"></i>
            </button>
            <button class="p-3 rounded-xl hover:bg-white/10 transition-colors" title="Lienzo" onclick="navigate('canvas')">
                <i class="ph ph-scribble-loop text-2xl text-gray-300"></i>
            </button>
        </div>

        <!-- Herramientas Inferiores -->
        <div class="mt-auto flex flex-col gap-4">
            <button class="p-3 rounded-xl hover:bg-white/10 transition-colors" title="Exportar Copia de Seguridad" onclick="exportData()">
                <i class="ph ph-download-simple text-2xl text-gray-300"></i>
            </button>
        </div>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <!-- Aquí cargaremos dinámicamente las diferentes pantallas de la app -->
    <main class="flex-1 relative h-full safe-pt safe-pb safe-pr overflow-y-auto" id="main-view">
        
        <!-- VISTA DE GESTOR DE PROYECTOS (Por defecto) -->
        <div class="p-10 h-full flex flex-col">
            <header class="mb-8">
                <h1 class="text-4xl font-light mb-2">Proyectos</h1>
                <p class="text-gray-400 text-sm">Almacenamiento local activo. Tus datos no salen de este iPad.</p>
            </header>

            <!-- Cuadrícula de Proyectos -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="projects-grid">
                
                <!-- Botón: Crear Nuevo Proyecto -->
                <button class="border-2 border-dashed border-gray-500 rounded-3xl h-56 flex flex-col items-center justify-center hover:bg-studio-panel transition-colors hover:border-studio-accent group">
                    <div class="bg-gray-700/50 p-4 rounded-full mb-4 group-hover:bg-studio-accent/20 transition-colors">
                        <i class="ph ph-plus text-3xl text-gray-400 group-hover:text-studio-accent"></i>
                    </div>
                    <span class="text-gray-400 font-medium group-hover:text-studio-text">Nuevo Proyecto</span>
                </button>

                <!-- El sistema inyectará aquí los proyectos guardados -->

            </div>
        </div>
    </main>

    <!-- SCRIPT PRINCIPAL DE LÓGICA -->
    <script>
        // 1. INICIALIZACIÓN DE LA BASE DE DATOS LOCAL
        // Dexie simplifica IndexedDB. Aquí definimos el "mapa" de datos.
        const db = new Dexie("StudioArtDB");

        db.version(1).stores({
            // ++id hace que se asigne un número único automáticamente a cada registro
            projects: '++id, title, category, dateCreated',
            references: '++id, projectId, imageBlob',
            sketches: '++id, projectId, canvasData'
        });

        // 2. REGISTRO DEL SERVICE WORKER (Necesario para PWA en iPad)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('El Service Worker requiere un archivo sw.js para instalarse.');
                });
            });
        }

        // 3. FUNCIONES DE NAVEGACIÓN Y ACCIONES (Placeholder por ahora)
        function navigate(view) {
            console.log("Cambiando a la vista: " + view);
            // En el próximo paso programaremos cómo cambia la pantalla al hacer clic.
        }

        function exportData() {
            alert("Módulo de exportación .zip en desarrollo.");
        }
    </script>
</body>
</html>
